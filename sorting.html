<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisuAlgo PTIK - Visualisasi Sorting</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">VisuAlgo PTIK</div>
        <ul class="nav-links">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="sorting.html" class="active">Sorting</a></li>
            <li><a href="searching.html">Searching</a></li>
            <li><a href="petunjuk.html">Petunjuk</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1>Visualisasi Algoritma Sorting</h1>
        
        <!-- Pilihan Algoritma -->
        <div class="algo-selector">
            <button onclick="selectSortingAlgo('bubble')">Bubble Sort</button>
            <button onclick="selectSortingAlgo('selection')">Selection Sort</button>
            <button onclick="selectSortingAlgo('insertion')">Insertion Sort</button>
            <button onclick="selectSortingAlgo('quick')">Quick Sort</button>
            <button onclick="selectSortingAlgo('merge')">Merge Sort</button>
        </div>

        <!-- Canvas Visualisasi -->
        <div class="visualizer-container">
            <div id="array-container" class="bar-chart-space"></div>
        </div>

        <!-- Kontrol Panel -->
        <div class="control-panel">
            <button id="btn-play">Mulai</button>
            <button id="btn-pause">Jeda</button>
            <button id="btn-step">Langkah</button>
            <button id="btn-reset">Reset</button>
            <button id="btn-shuffle">Acak Data</button>
            <input type="text" id="custom-input" placeholder="Contoh: 80, 30, 55">
            <button id="btn-apply">Terapkan</button>
        </div>
    </main>

    <!-- Script khusus disematkan dari folder js -->
    <script src="js/sorting.js"></script>
</body>
</html>
