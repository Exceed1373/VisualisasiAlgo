<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisuAlgo PTIK - Visualisasi Searching</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">VisuAlgo PTIK</div>
        <ul class="nav-links">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="sorting.html">Sorting</a></li>
            <li><a href="searching.html" class="active">Searching</a></li>
            <li><a href="petunjuk.html">Petunjuk</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1>Visualisasi Algoritma Searching</h1>
        
        <div class="algo-selector">
            <button onclick="selectSearchingAlgo('linear')">Linear Search</button>
            <button onclick="selectSearchingAlgo('binary')">Binary Search</button>
        </div>

        <div class="visualizer-container">
            <div id="search-array-container" class="array-memory-space"></div>
        </div>

        <div class="control-panel">
            <input type="number" id="target-value" placeholder="Target Nilai">
            <button id="btn-search">Mulai Cari</button>
            <button id="btn-search-step">Langkah</button>
            <button id="btn-search-shuffle">Data Acak</button>
        </div>
    </main>

    <script src="js/searching.js"></script>
</body>
</html>
